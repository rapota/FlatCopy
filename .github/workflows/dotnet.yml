# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore FlatCopy.slnx
    - name: Build
      run: dotnet build --no-restore FlatCopy.slnx
    - name: Test
      run: dotnet test --no-build --verbosity normal FlatCopy.slnx
    - name: Publish win-x64
      run: dotnet publish FlatCopy\FlatCopy.csproj --configuration Release --output flatcopy-win-x64 --runtime win-x64
    - name: Upload win-x64
      uses: actions/upload-artifact@v4.6.2
      with:
        name: flatcopy-win-x64
        path: flatcopy-win-x64
